<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovo Clicker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #252525, #0b0b0b);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 5px;
    font-size: 32px;
}

#contador,
#idade,
#moedas {
    font-size: 20px;
    margin-top: 6px;
}

#moedas {
    color: #ffd700;
}

.area-jogo {
    min-height: 65vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.centro {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#ovo {
    border: none;
    background: transparent;
    font-size: 180px;
    cursor: pointer;
    transition: transform 0.1s;
}

#ovo:active {
    transform: scale(0.9);
}

#fase {
    font-size: 23px;
    margin-bottom: 15px;
    color: #ddd;
}

.barra {
    width: 300px;
    height: 12px;
    background: #333;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
}

#progresso {
    width: 0%;
    height: 100%;
    background: white;
    transition: width 0.2s;
}

#mensagem {
    margin-top: 15px;
    color: #aaa;
    font-size: 17px;
}

/* PAINÉIS */

.painel {
    position: absolute;
    top: 20px;
    width: 230px;
    background: rgba(25,25,25,0.95);
    border: 1px solid #444;
    border-radius: 15px;
    padding: 15px;
}

.painel-esquerdo {
    left: 20px;
}

.painel-direito {
    right: 20px;
}

.painel h2 {
    margin-top: 0;
    font-size: 20px;
}

/* PODERES */

.poder {
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.poder strong {
    display: block;
    margin-bottom: 5px;
}

.poder small {
    color: #aaa;
}

.poder button {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.comprar {
    background: #ffd700;
    color: #111;
}

.comprar:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
}

.ativar {
    background: #28a745;
    color: white;
}

.desativar {
    background: #b52b2b;
    color: white;
}

/* AUTO CLICKER */

.auto-box {
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
}

#botaoAuto {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    background: #555;
    color: white;
}

#botaoAuto.ativo {
    background: #28a745;
}

#velocidadeAuto {
    margin-top: 8px;
    color: #aaa;
    font-size: 14px;
}

/* EVOLUÇÕES */

.evolucoes {
    padding: 20px;
}

.evolucoes h2 {
    margin-bottom: 15px;
}

.lista-fases {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.fase-card {
    width: 150px;
    background: #191919;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px;
    color: #aaa;
}

.fase-card.desbloqueada {
    border-color: #fff;
    color: white;
}

.resetar {
    margin: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #8b0000;
    color: white;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 950px) {
    .area-jogo {
        flex-direction: column;
        padding: 20px;
    }

    .painel {
        position: static;
        width: 90%;
        max-width: 350px;
        margin: 10px auto;
    }

    .centro {
        order: -1;
        margin: 20px 0;
    }

    #ovo {
        font-size: 130px;
    }
}
</style>
</head>

<body>

<h1>🥚 Ovo Clicker</h1>

<div id="contador">Toques: 0</div>
<div id="idade">Idade do ovo: 0</div>
<div id="moedas">🪙 Moedas: 0</div>

<div class="area-jogo">

    <!-- PODERES MANUAIS -->
    <div class="painel painel-esquerdo">

        <h2>⚡ Poderes</h2>

        <div id="listaPoderes"></div>

    </div>

    <!-- CENTRO -->
    <div class="centro">

        <div id="fase">🥚 Ovo recém-nascido</div>

        <button id="ovo">🥚</button>

        <div class="barra">
            <div id="progresso"></div>
        </div>

        <div id="mensagem">
            Clique no ovo!
        </div>

    </div>

    <!-- AUTO CLICKER -->
    <div class="painel painel-direito">

        <h2>🤖 Auto Clicker</h2>

        <div class="auto-box">

            <button id="botaoAuto">
                🤖 Ativar Auto Clicker
            </button>

            <div id="velocidadeAuto">
                Velocidade: 1 toque a cada 4 segundos
            </div>

        </div>

        <h2>🔥 Poderes Ativos</h2>

        <div id="poderesAtivos">
            Nenhum poder ativo.
        </div>

    </div>

</div>

<!-- EVOLUÇÕES -->

<div class="evolucoes">

    <h2>🏆 Evoluções</h2>

    <div class="lista-fases" id="listaFases"></div>

</div>

<button class="resetar" onclick="resetarJogo()">
    🔄 Resetar jogo
</button>

<script>

/* =========================
   FASES
========================= */

const fases = [

    {nivel:0, nome:"🥚 Ovo recém-nascido"},
    {nivel:5, nome:"🥚 Ovo começando a rachar"},
    {nivel:10, nome:"🥚 Ovo rachado"},
    {nivel:25, nome:"🍳 Ovo quebrado"},
    {nivel:50, nome:"🟡 Gema"},
    {nivel:100, nome:"🟡 Gema se desenvolvendo"},
    {nivel:150, nome:"🐣 Nasce o pinto"},
    {nivel:300, nome:"🐥 Pinto recém-nascido"},
    {nivel:1000, nome:"🐥 Pinto crescendo"},
    {nivel:2500, nome:"🐤 Pinto jovem"},
    {nivel:5000, nome:"🐤 Ave jovem"},
    {nivel:10000, nome:"🐔 Galinha jovem"},
    {nivel:20000, nome:"🐔 Galinha crescendo"},
    {nivel:35000, nome:"🐔 Galinha adulta"},
    {nivel:50000, nome:"🐓 Ave evoluída"},
    {nivel:75000, nome:"🦃 Ave gigante"},
    {nivel:100000, nome:"🦅 Ave poderosa"},
    {nivel:150000, nome:"🦅 Ave lendária"},
    {nivel:200000, nome:"🐉 Criatura misteriosa"},
    {nivel:300000, nome:"🐉 Dragão jovem"},
    {nivel:400000, nome:"🐲 Dragão adulto"},
    {nivel:500000, nome:"🔥 Dragão poderoso"},
    {nivel:600000, nome:"⚡ Criatura elétrica"},
    {nivel:700000, nome:"🌑 Criatura sombria"},
    {nivel:775000, nome:"🌟 Criatura celestial"},
    {nivel:850000, nome:"💫 Forma cósmica"},
    {nivel:900000, nome:"🌌 Forma universal"},
    {nivel:950000, nome:"👑 Forma suprema"},
    {nivel:990000, nome:"💎 Forma final"},
    {nivel:1000000, nome:"🏆 EVOLUÇÃO MÁXIMA"}

];


/* =========================
   PODERES MANUAIS
========================= */

const poderes = [

    {
        id:"x15",
        nome:"⚡ Multiplicador ×1,5",
        multiplicador:1.5,
        preco:100,
        retrocesso:1
    },

    {
        id:"x2",
        nome:"🔥 Multiplicador ×2",
        multiplicador:2,
        preco:500,
        retrocesso:2
    },

    {
        id:"x3",
        nome:"💥 Multiplicador ×3",
        multiplicador:3,
        preco:2500,
        retrocesso:3
    },

    {
        id:"x5",
        nome:"🚀 Multiplicador ×5",
        multiplicador:5,
        preco:10000,
        retrocesso:4
    },

    {
        id:"x10",
        nome:"🌟 Multiplicador ×10",
        multiplicador:10,
        preco:50000,
        retrocesso:5
    },

    {
        id:"x20",
        nome:"💎 Multiplicador ×20",
        multiplicador:20,
        preco:250000,
        retrocesso:6
    }

];


/* =========================
   AUTO CLICKER
========================= */

const poderesAuto = [

    {
        id:"auto1",
        nome:"🤖 Auto Clicker",
        preco:100,
        intervalo:4000
    },

    {
        id:"auto2",
        nome:"⚡ Auto ×2",
        preco:500,
        intervalo:3000
    },

    {
        id:"auto3",
        nome:"🔥 Auto ×3",
        preco:2500,
        intervalo:2000
    },

    {
        id:"auto4",
        nome:"🚀 Auto ×4",
        preco:10000,
        intervalo:1000
    },

    {
        id:"auto5",
        nome:"💥 Auto ×5",
        preco:50000,
        intervalo:500
    },

    {
        id:"auto6",
        nome:"🌟 Auto ×6",
        preco:250000,
        intervalo:250
    }

];


/* =========================
   VARIÁVEIS
========================= */

let toques = Number(localStorage.getItem("ovo_toques")) || 0;

let moedas = Number(localStorage.getItem("ovo_moedas")) || 0;

let poderesComprados =
    JSON.parse(localStorage.getItem("ovo_poderes")) || [];

let poderesAtivos =
    JSON.parse(localStorage.getItem("ovo_poderes_ativos")) || [];

let poderesAutoComprados =
    JSON.parse(localStorage.getItem("ovo_auto_poderes")) || [];

let autoAtivo =
    localStorage.getItem("ovo_auto_ativo") === "true";

let intervaloAuto = null;


/* =========================
   ELEMENTOS
========================= */

const ovo = document.getElementById("ovo");

const contador = document.getElementById("contador");

const idade = document.getElementById("idade");

const moedasTexto = document.getElementById("moedas");

const faseTexto = document.getElementById("fase");

const progresso = document.getElementById("progresso");

const mensagem = document.getElementById("mensagem");

const listaPoderes = document.getElementById("listaPoderes");

const poderesAtivosDiv =
    document.getElementById("poderesAtivos");

const listaFases =
    document.getElementById("listaFases");

const botaoAuto =
    document.getElementById("botaoAuto");

const velocidadeAuto =
    document.getElementById("velocidadeAuto");


/* =========================
   MULTIPLICADOR
========================= */

function calcularMultiplicador() {

    let multiplicador = 1;

    poderesAtivos.forEach(id => {

        const poder = poderes.find(p => p.id === id);

        if (poder) {
            multiplicador *= poder.multiplicador;
        }

    });

    return multiplicador;
}


/* =========================
   DESCOBRIR FASE
========================= */

function descobrirFase() {

    let atual = 0;

    for (let i = 0; i < fases.length; i++) {

        if (toques >= fases[i].nivel) {
            atual = i;
        }

    }

    return atual;
}


/* =========================
   DAR TOQUE
========================= */

function darToque() {

    const multiplicador =
        calcularMultiplicador();

    toques += multiplicador;

    moedas += multiplicador;

    salvar();

    atualizarTela();

}


/* =========================
   SALVAR
========================= */

function salvar() {

    localStorage.setItem(
        "ovo_toques",
        toques
    );

    localStorage.setItem(
        "ovo_moedas",
        moedas
    );

    localStorage.setItem(
        "ovo_poderes",
        JSON.stringify(poderesComprados)
    );

    localStorage.setItem(
        "ovo_poderes_ativos",
        JSON.stringify(poderesAtivos)
    );

    localStorage.setItem(
        "ovo_auto_poderes",
        JSON.stringify(poderesAutoComprados)
    );

    localStorage.setItem(
        "ovo_auto_ativo",
        autoAtivo
    );

}


/* =========================
   ATUALIZAR TELA
========================= */

function atualizarTela() {

    contador.textContent =
        "Toques: " + Math.floor(toques);

    idade.textContent =
        "Idade do ovo: " + Math.floor(toques);

    moedasTexto.textContent =
        "🪙 Moedas: " + Math.floor(moedas);

    const indice = descobrirFase();

    faseTexto.textContent =
        fases[indice].nome;

    atualizarOvo(indice);

    atualizarProgresso(indice);

    renderizarPoderes();

    renderizarPoderesAtivos();

    renderizarFases();

    atualizarAuto();

}


/* =========================
   OVO
========================= */

function atualizarOvo(indice) {

    if (indice < 1) {
        ovo.textContent = "🥚";
    }

    else if (indice < 2) {
        ovo.textContent = "🥚";
    }

    else if (indice < 3) {
        ovo.textContent = "🥚";
    }

    else if (indice < 4) {
        ovo.textContent = "🍳";
    }

    else if (indice < 6) {
        ovo.textContent = "🟡";
    }

    else if (indice < 10) {
        ovo.textContent = "🐣";
    }

    else if (indice < 14) {
        ovo.textContent = "🐔";
    }

    else if (indice < 18) {
        ovo.textContent = "🦅";
    }

    else if (indice < 22) {
        ovo.textContent = "🐉";
    }

    else if (indice < 24) {
        ovo.textContent = "⚡";
    }

    else if (indice < 27) {
        ovo.textContent = "🌌";
    }

    else if (indice < 29) {
        ovo.textContent = "💎";
    }

    else {
        ovo.textContent = "🏆";
    }

}


/* =========================
   PROGRESSO
========================= */

function atualizarProgresso(indice) {

    if (indice >= fases.length - 1) {

        progresso.style.width = "100%";

        return;

    }

    const atual = fases[indice].nivel;

    const proxima = fases[indice + 1].nivel;

    const porcentagem =
        ((toques - atual) /
        (proxima - atual)) * 100;

    progresso.style.width =
        Math.max(0, Math.min(100, porcentagem)) + "%";

}


/* =========================
   PODERES
========================= */

function renderizarPoderes() {

    listaPoderes.innerHTML = "";

    poderes.forEach(poder => {

        const comprado =
            poderesComprados.includes(poder.id);

        const ativo =
            poderesAtivos.includes(poder.id);

        const div =
            document.createElement("div");

        div.className = "poder";

        div.innerHTML = `
            <strong>${poder.nome}</strong>

            <small>
                💰 ${poder.preco.toLocaleString("pt-BR")}
                moedas
            </small>

            ${
                !comprado
                ?
                `<button
                    class="comprar"
                    ${moedas < poder.preco ? "disabled" : ""}
                    onclick="comprarPoder('${poder.id}')">
                    Comprar
                </button>`
                :
                `<button
                    class="${ativo ? "desativar" : "ativar"}"
                    onclick="alternarPoder('${poder.id}')">
                    ${ativo ? "🔴 Desativar" : "🟢 Ativar"}
                </button>`
            }
        `;

        listaPoderes.appendChild(div);

    });

}


/* =========================
   COMPRAR PODER
========================= */

function comprarPoder(id) {

    const poder =
        poderes.find(p => p.id === id);

    if (!poder) return;

    if (poderesComprados.includes(id)) {
        return;
    }

    if (moedas < poder.preco) {

        alert("Você não tem moedas suficientes!");

        return;

    }

    moedas -= poder.preco;

    poderesComprados.push(id);

    /*
       O poder é comprado,
       mas NÃO fica ativo automaticamente.
    */

    salvar();

    atualizarTela();

}


/* =========================
   ATIVAR / DESATIVAR
========================= */

function alternarPoder(id) {

    if (!poderesComprados.includes(id)) {
        return;
    }

    if (poderesAtivos.includes(id)) {

        poderesAtivos =
            poderesAtivos.filter(
                poderId => poderId !== id
            );

    }

    else {

        poderesAtivos.push(id);

    }

    salvar();

    atualizarTela();

}


/* =========================
   PODERES ATIVOS
========================= */

function renderizarPoderesAtivos() {

    if (poderesAtivos.length === 0) {

        poderesAtivosDiv.innerHTML =
            "Nenhum poder ativo.";

        return;

    }

    poderesAtivosDiv.innerHTML = "";

    let multiplicador = 1;

    poderesAtivos.forEach(id => {

        const poder =
            poderes.find(p => p.id === id);

        if (!poder) return;

        multiplicador *= poder.multiplicador;

        const div =
            document.createElement("div");

        div.className = "poder";

        div.innerHTML = `
            <strong>${poder.nome}</strong>
            <small>🟢 Ativo</small>
        `;

        poderesAtivosDiv.appendChild(div);

    });

    const total =
        document.createElement("div");

    total.style.marginTop = "10px";

    total.innerHTML =
        `⚡ Multiplicador total: ×${multiplicador}`;

    poderesAtivosDiv.appendChild(total);

}


/* =========================
   AUTO CLICKER
========================= */

function intervaloAtualAuto() {

    if (poderesAutoComprados.length === 0) {

        return 4000;

    }

    let menor =
        4000;

    poderesAutoComprados.forEach(id => {

        const poder =
            poderesAuto.find(p => p.id === id);

        if (poder && poder.intervalo < menor) {

            menor = poder.intervalo;

        }

    });

    return menor;

}


/* =========================
   AUTO CLICKER TELA
========================= */

function atualizarAuto() {

    const intervalo =
        intervaloAtualAuto();

    const segundos =
        intervalo / 1000;

    velocidadeAuto.textContent =
        `Velocidade: 1 toque a cada ${segundos} segundo${segundos === 1 ? "" : "s"}`;

    if (autoAtivo) {

        botaoAuto.textContent =
            "🟢 Desativar Auto Clicker";

        botaoAuto.classList.add("ativo");

    }

    else {

        botaoAuto.textContent =
            "🤖 Ativar Auto Clicker";

        botaoAuto.classList.remove("ativo");

    }

}


/* =========================
   ATIVAR AUTO
========================= */

botaoAuto.addEventListener("click", function() {

    autoAtivo = !autoAtivo;

    if (autoAtivo) {

        iniciarAutoClicker();

    }

    else {

        pararAutoClicker();

    }

    salvar();

    atualizarAuto();

});


/* =========================
   INICIAR AUTO
========================= */

function iniciarAutoClicker() {

    pararAutoClicker();

    const intervalo =
        intervaloAtualAuto();

    intervaloAuto =
        setInterval(() => {

            darToque();

        }, intervalo);

}


/* =========================
   PARAR AUTO
========================= */

function pararAutoClicker() {

    if (intervaloAuto) {

        clearInterval(intervaloAuto);

        intervaloAuto = null;

    }

}


/* =========================
   FASES
========================= */

function renderizarFases() {

    listaFases.innerHTML = "";

    const atual =
        descobrirFase();

    fases.forEach((fase, index) => {

        const div =
            document.createElement("div");

        div.className = "fase-card";

        if (index <= atual) {

            div.classList.add("desbloqueada");

        }

        div.innerHTML = `
            <strong>${index + 1}ª fase</strong>
            <br>
            ${fase.nome}
            <br>
            <small>${fase.nivel.toLocaleString("pt-BR")} toques</small>
        `;

        listaFases.appendChild(div);

    });

}


/* =========================
   CLIQUE MANUAL
========================= */

ovo.addEventListener("click", function() {

    darToque();

});


/* =========================
   RESET
========================= */

function resetarJogo() {

    const confirmar =
        confirm(
            "Tem certeza que deseja apagar todo o progresso?"
        );

    if (!confirmar) return;

    localStorage.clear();

    toques = 0;
    moedas = 0;

    poderesComprados = [];
    poderesAtivos = [];
    poderesAutoComprados = [];

    autoAtivo = false;

    pararAutoClicker();

    atualizarTela();

}


/* =========================
   INICIAR
========================= */

atualizarTela();

if (autoAtivo) {

    iniciarAutoClicker();

}

</script>

</body>
</html>

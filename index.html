<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ovo Clicker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 25px 0 5px;
            font-size: 32px;
        }

        #contador {
            font-size: 24px;
            margin-top: 10px;
        }

        #idade {
            color: #aaa;
            margin-top: 5px;
        }

        .jogo {
            height: 65vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #ovo {
            border: none;
            background: transparent;
            font-size: 180px;
            cursor: pointer;

            transition: transform 0.1s;
        }

        #ovo:active {
            transform: scale(0.9);
        }

        #fase {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .barra {
            width: 300px;
            height: 12px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 25px;
        }

        #progresso {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.2s;
        }

        #mensagem {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>🥚 Ovo Clicker</h1>

    <div id="contador">
        Cliques: 0
    </div>

    <div id="idade">
        Idade do ovo: 0
    </div>


    <div class="jogo">

        <div id="fase">
            Ovo inteiro
        </div>

        <button id="ovo">🥚</button>

        <div class="barra">
            <div id="progresso"></div>
        </div>

        <div id="mensagem">
            Clique no ovo!
        </div>

    </div>


    <script>

        let cliques = 0;

        const ovo = document.getElementById("ovo");
        const contador = document.getElementById("contador");
        const idade = document.getElementById("idade");
        const fase = document.getElementById("fase");
        const progresso = document.getElementById("progresso");
        const mensagem = document.getElementById("mensagem");


        ovo.addEventListener("click", function() {

            cliques++;

            contador.textContent = "Cliques: " + cliques;

            idade.textContent = "Idade do ovo: " + cliques;


            // Fases temporárias
            if (cliques < 5) {

                ovo.textContent = "🥚";
                fase.textContent = "Ovo inteiro";

            } 
            else if (cliques < 10) {

                ovo.textContent = "🥚";
                fase.textContent = "O ovo está rachando!";

            } 
            else if (cliques < 50) {

                ovo.textContent = "🍳";
                fase.textContent = "O ovo quebrou!";

            } 
            else {

                ovo.textContent = "🟡";
                fase.textContent = "A gema apareceu!";

            }


            // Barra de progresso
            let porcentagem = (cliques % 10) * 10;

            progresso.style.width = porcentagem + "%";


            mensagem.textContent =
                "Continue clicando...";

        });

    </script>

</body>
</html>
